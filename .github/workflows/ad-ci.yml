# my ad pipeline
name: ad-ci

on:
  push:
    branches: [main]
    paths:
      - "src/ad/**"
      - ".github/workflows/ad-ci.yml"
  pull_request:
    paths:
      - "src/ad/**"
      - ".github/workflows/ad-ci.yml"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 24
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        working-directory: /src/ad
        run: ./gradlew build

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/ad/Dockerfile
          push: ${{github.event_name == 'push'}}
          tags: ghcr.io/${{ github.repository }}/ad:${{ github.sha }}
          cache-from: type=gha,scope=ad
          cache-to: type=gha,scope=ad,mode=max
