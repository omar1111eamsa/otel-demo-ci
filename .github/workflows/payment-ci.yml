# my payment pipeline
name: payment-ci

on:
  push:
    branches: [main]
    paths:
      - "src/payment/**"
      - ".github/workflows/payment-ci.yml"
  pull_request:
    paths:
      - "src/payment/**"
      - ".github/workflows/payment-ci.yml"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/payment/package-lock.json
      - run: npm ci
        working-directory: src/payment
      - run: npm ci
        working-directory: src/payment

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/payment/Dockerfile
          push: ${{github.event_name == 'push'}}
          tags: ghcr.io/${{ github.repository }}/payment:${{ github.sha }}
          cache-from: type=gha,scope=payment
          cache-to: type=gha,scope=payment,mode=max
