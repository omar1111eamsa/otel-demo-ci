name: checkout-ci

on:
  push:
    branches: [main]
    paths:
      - "src/checkout/**"
      - ".github/workflows/checkout-ci.yml"
  pull_request:
    paths:
      - "src/checkout/**"
      - ".github/workflows/checkout-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/checkout/go.mod
          cache-dependency-path: src/checkout/go.sum
      - run: go vet ./...
        working-directory: src/checkout
      - run: go test ./...
        working-directory: src/checkout
