# my checkout pipeline
name: checkout-ci

on:
  push:
    branches: [main]
    paths:
      - "src/checkout/**"
      - ".github/workflows/checkout-ci.yml"
  pull_request:
    paths:
      - "src/checkout/**"
      - ".github/workflows/checkout-ci.yml"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/checkout/go.mod
          cache-dependency-path: src/checkout/go.sum
      - run: go vet ./...
        working-directory: src/checkout
      - run: go test ./...
        working-directory: src/checkout

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/checkout/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/checkout:${{ github.sha }}
          cache-from: type=gha,scope=checkout
          cache-to: type=gha,scope=checkout,mode=max
